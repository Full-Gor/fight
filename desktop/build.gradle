plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

sourceSets.main.resources.srcDirs = ["../app/src/main/assets"]

application {
    mainClass = "com.shadowfight.game.DesktopLauncherKt"
}

dependencies {
    implementation project(':app')

    // LibGDX Desktop
    implementation "com.badlogicgames.gdx:gdx:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-desktop"

    // Controller support (Gamepad/Joystick)
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.3"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.3"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.shadowfight.game.DesktopLauncherKt'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('run') {
    workingDir = file("../app/src/main/assets")
    ignoreExitValue = true
}
